name: Build Xbox IPTV App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        platform: [x64, arm64]
    
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Ripristina pacchetti NuGet
        run: dotnet restore XboxIptvSmarters.csproj
        
      - name: Build Release
        run: dotnet build XboxIptvSmarters.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }}
          
      - name: Publish per Xbox
        run: dotnet publish XboxIptvSmarters.csproj --configuration Release --no-restore -p:Platform=${{ matrix.platform }}
          
      - name: Crea directory output
        run: |
          $platform = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "output/${platform}" | Out-Null
          
      - name: Upload artefatti
        uses: actions/upload-artifact@v4
        with:
          name: XboxIptvSmarters-${{ matrix.platform }}
          path: bin/Release/net8.0-windows10.0.19041.0/${{ matrix.platform }}/publish/
          retention-days: 7
