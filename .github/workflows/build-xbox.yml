name: Build Xbox IPTV App x64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Install Windows APP SDK
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json
          
      - name: Restore NuGet (pulito)
        run: |
          dotnet restore XboxIptvSmarters.csproj /p:DisableXamlCompiler=true
          
      - name: Build Release x64
        run: |
          dotnet build XboxIptvSmarters.csproj --configuration Release /p:DisableXamlCompiler=true -p:Platform=x64 --no-restore
        
      - name: Publish x64
        run: |
          dotnet publish XboxIptvSmarters.csproj --configuration Release /p:DisableXamlCompiler=true -p:Platform=x64 --no-restore -o publish
          
      - name: Upload artefatti
        uses: actions/upload-artifact@v4
        with:
          name: XboxIptvSmarters-x64
          path: publish/
          retention-days: 7
